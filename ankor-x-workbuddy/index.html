<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>安克 X Workbuddy · 角色动画</title>
<style>
  :root {
    --bg: #0f0f13;
    --panel: #1a1a20;
    --panel-2: #22222a;
    --border: #2c2c34;
    --text: #ececf2;
    --text-dim: #9a9aa6;
    --accent: #4f7cff;
    --accent-soft: rgba(79, 124, 255, 0.16);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Microsoft YaHei", sans-serif;
  }

  .header {
    padding: 28px 32px 20px;
    border-bottom: 1px solid var(--border);
  }
  .header h1 { font-size: 20px; font-weight: 600; }
  .header p { font-size: 13px; color: var(--text-dim); margin-top: 6px; }

  .layout {
    display: flex;
    min-height: calc(100vh - 90px);
  }

  .sidebar {
    width: 300px;
    min-width: 300px;
    border-right: 1px solid var(--border);
    background: var(--panel);
    padding: 12px;
    overflow-y: auto;
  }

  .group-title {
    font-size: 12px;
    color: var(--text-dim);
    padding: 10px 8px 4px;
    letter-spacing: 0.5px;
  }

  .video-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: background 0.15s, border-color 0.15s;
    user-select: none;
  }
  .video-item:hover { background: var(--panel-2); }
  .video-item.active { background: var(--accent-soft); border-color: var(--accent); }
  .video-item .name { font-size: 13px; word-break: break-all; }

  .stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
  }
  .player {
    width: 100%;
    max-width: 720px;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  }
  .player video {
    width: 100%;
    display: block;
    max-height: 70vh;
  }
  .player .caption {
    padding: 14px 16px;
    font-size: 14px;
    background: var(--panel);
    border-top: 1px solid var(--border);
  }
  .empty {
    color: var(--text-dim);
    font-size: 14px;
    text-align: center;
    padding: 40px;
  }
</style>
</head>
<body>
  <div class="header">
    <h1>安克 X Workbuddy · 角色动画</h1>
    <p>共 <span id="count">0</span> 个动画视频，点击左侧列表切换预览</p>
  </div>

  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="stage">
      <div class="player" id="player" style="display:none;">
        <video id="video" controls loop autoplay muted playsinline></video>
        <div class="caption" id="caption"></div>
      </div>
      <div class="empty" id="empty">加载中…</div>
    </main>
  </div>

<script>
  // 视频清单（文件名 + 显示名 + 分组）
  const GROUPS = [
    { title: "新手引导", items: [
      ["新手引导-唤起.mp4", "唤起"],
      ["新手引导-等待唤起.mp4", "等待唤起"],
      ["新手引导-上滑.mp4", "上滑"],
      ["新手引导-滑动边缘.mp4", "滑动边缘"],
      ["新手引导-指右上角.mp4", "指右上角"],
      ["新手引导-很棒.mp4", "很棒"],
    ]},
    { title: "首页闲暇", items: [
      ["首页闲暇-看书.mp4", "看书"],
      ["首页闲暇-运动.mp4", "运动"],
      ["首页闲暇-音乐.mp4", "音乐"],
    ]},
    { title: "状态", items: [
      ["打招呼new.mp4", "打招呼"],
      ["有什么问题.mp4", "有什么问题"],
      ["我在听.mp4", "我在听"],
      ["执行中.mp4", "执行中"],
      ["执行中-聆听.mp4", "执行中-聆听"],
      ["成功.mp4", "成功"],
      ["失败.mp4", "失败"],
      ["休眠.mp4", "休眠"],
      ["沉睡.mp4", "沉睡"],
    ]},
  ];

  const sidebar = document.getElementById('sidebar');
  const videoEl = document.getElementById('video');
  const player = document.getElementById('player');
  const caption = document.getElementById('caption');
  const empty = document.getElementById('empty');
  const countEl = document.getElementById('count');

  let total = 0;

  GROUPS.forEach((g) => {
    const title = document.createElement('div');
    title.className = 'group-title';
    title.textContent = g.title;
    sidebar.appendChild(title);

    g.items.forEach(([file, name]) => {
      total++;
      const item = document.createElement('div');
      item.className = 'video-item';
      const nameEl = document.createElement('span');
      nameEl.className = 'name';
      nameEl.textContent = name;
      item.appendChild(nameEl);
      item.addEventListener('click', () => {
        document.querySelectorAll('.video-item').forEach((el) => el.classList.remove('active'));
        item.classList.add('active');
        play(file, name);
      });
      sidebar.appendChild(item);
    });
  });

  countEl.textContent = total;

  function play(file, name) {
    videoEl.src = file;
    caption.textContent = name;
    player.style.display = 'block';
    empty.style.display = 'none';
    videoEl.play().catch(() => {});
  }

  // 默认播放第一个
  const first = GROUPS[0].items[0];
  if (first) {
    document.querySelector('.video-item').classList.add('active');
    play(first[0], first[1]);
  }
</script>
</body>
</html>
